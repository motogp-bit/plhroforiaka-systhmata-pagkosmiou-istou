<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Items - Etsy-Bitsy</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->
    <header>
        <a href="homepage.html">
            <img src="images/logo.png" alt="Etsy-Bitsy Logo" class="logo">
        </a>
        <nav>
            <a href="homepage.html">Home</a>
            <a href="items.html" class="active">Items</a>
        </nav>
    </header>

    <main>

        <!-- Search Section -->
        <div class="search-bar">
            <input type="text" placeholder="Search tiny crafts...">
            <button>Search</button>
        </div>

        <!-- Item Grid -->
        <div class="items-container">

            <div class="item">
                <div class="img-wrapper">
                    <div class="heart"></div>
                    <img src="images/item1.jpg" alt="Title1">
                </div>
                <h3>Title1</h3>
                <p>Caption1.</p>
            </div>

            <div class="item">
                <div class="img-wrapper">
                    <div class="heart"></div>
                    <img src="images/item2.jpg" alt="Title2">
                </div>
                <h3>Title2</h3>
                <p>Caption2.</p>
            </div>

            <div class="item">
                <div class="img-wrapper">
                    <div class="heart"></div>
                    <img src="images/item3.jpg" alt="Title3">
                </div>
                <h3>Title3</h3>
                <p>Caption3.</p>
            </div>

            <div class="item">
                <div class="img-wrapper">
                    <div class="heart"></div>
                    <img src="images/item4.jpg" alt="Title4">
                </div>
                <h3>Title4</h3>
                <p>Caption4.</p>
            </div>

            <div class="item">
                <div class="img-wrapper">
                    <div class="heart"></div>
                    <img src="images/item5.jpg" alt="Title5">
                </div>
                <h3>Title5</h3>
                <p>Caption5.</p>
            </div>

            <div class="item">
                <div class="img-wrapper">
                    <div class="heart"></div>
                    <img src="images/item6.jpg" alt="Title6">
                </div>
                <h3>Title6</h3>
                <p>Caption6.</p>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>Team: Name1, Name2, Name3</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
